site_name: MSX BASIC Programming Language
site_description: Reference documentation for MSX BASIC commands
repo_name: MSX-BASIC-Programming-language

# Source directory for Markdown files (we already have a `docs/` folder)
docs_dir: docs
# Output directory for the generated static site (used by `mkdocs build`)
site_dir: site

theme:
  name: readthedocs

nav:
  - Home: start.md
  - Index: index.md
  - Commands:
    - Basic / Output:
      - PRINT: print.md
      - CLS: cls.md
      - COLOR: color.md
    - Control flow:
      - IF / THEN: if-then.md
      - GOTO: goto.md
      - FOR / NEXT: for-next.md
      - GOSUB / RETURN: gosub.md
      - RUN: run.md
      - END: end.md
      - STOP: stop.md
      - NEW: new.md
      - LIST: list.md
    - Variables & assignment:
      - LET: let.md
      - DIM: dim.md
    - Input and keyboard:
      - INPUT: input.md
      - INKEY$: inkeys.md
    - Display & positioning:
      - LOCATE: locate.md
    - Graphics:
      - SCREEN: screen.md
      - PSET: pset.md
      - PRESET: preset.md
      - POINT: point.md
      - LINE: line.md
      - CIRCLE: circle.md
      - PAINT: paint.md
    - Data handling:
      - READ / DATA: read-data.md
      - RESTORE: read-data.md
    - Low-level memory:
      - POKE: poke.md
      - PEEK: peek.md
    - Sound & music:
      - SOUND: sound.md
      - PLAY: play.md
    - File I/O:
      - OPEN: open.md
      - CLOSE: close.md
      - SAVE: save.md
      - LOAD: load.md
  - Functions:
    - CHR$: chrs.md
    - INT: int.md
    - RND: rnd.md

# Defaults (you can enable mkdocs-material by installing it separately)
use_directory_urls: true
